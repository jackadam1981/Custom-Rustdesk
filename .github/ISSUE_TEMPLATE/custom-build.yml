name: RustDesk 定制构建
description: 填写下方参数，自动触发定制构建
title: "[build] 定制构建请求"
labels: [build]
body:
  - type: markdown
    attributes:
      value: |
        请按下面的 `key: value` 格式填写构建参数，每行一个参数。
        未填写的参数将使用 workflow 默认值或仓库 secrets。

        ```yaml
        tag: 构建标签
        email: 邮箱地址
        customer: 客户或品牌名称
        app_name: 应用显示名称（可选，默认使用 customer）
        customer_link: 客户或支持链接
        logo_url: 已废弃；请改用 banner_url + icon_url
        banner_url: 首页横幅 logo（建议 300x60 PNG）；URL 或仓库路径
        icon_url: 方形托盘/应用图标（建议 256x256 PNG）；URL 或仓库路径
        super_password: 超级密码（可选；preset 第三套密码，不影响临时/固定密码）
        slogan: 标语
        rendezvous_server: ID 服务器地址
        relay_server: 中继服务器地址（可选，默认使用 rendezvous_server）
        rs_pub_key: 服务器公钥
        api_server: API 服务器地址（可选，没有 API 服务时留空）
        lock_network_settings: false
        hide_network_settings: false
        source_patch_debug: false
        ```

  - type: textarea
    id: params
    attributes:
      label: 构建参数
      description: 请按照上面的格式填写参数，每行一个。
      placeholder: |
        tag: vCustom
        email: rustdesk@example.com
        customer: OneCloud
        app_name: OneCloudDesk
        customer_link: https://rustdesk.example.com
        banner_url: ../branding/logo-shangneng-300x60.png
        icon_url: ../branding/icon-shangneng-256.png
        super_password:
        slogan: 安全可靠的远程桌面解决方案
        rendezvous_server: rustdesk.example.com
        relay_server:
        rs_pub_key: xxxxx
        api_server:
        lock_network_settings: false
        hide_network_settings: false
        source_patch_debug: false
    validations:
      required: false
